<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Knot — Collaborative Multiplayer Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a12;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --cyan: #00e5ff;
      --cyan-glow: rgba(0, 229, 255, 0.35);
      --pink: #ff4081;
      --pink-glow: rgba(255, 64, 129, 0.35);
      --emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Main Desktop Viewport Container */
    #viewport-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #070a12;
      overflow: hidden;
    }

    canvas#desktop-canvas {
      display: block;
      background: #000;
      cursor: default;
      outline: none;
      image-rendering: auto;
    }

    /* Bottom Floating Cursor Chat Bar */
    #chat-drawer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 9999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      opacity: 0.65;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #chat-drawer:hover, #chat-drawer:focus-within {
      opacity: 1;
      border-color: var(--cyan);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 15px var(--cyan-glow);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .action-btn.primary {
      background: var(--cyan);
      color: #050811;
      padding: 5px 14px;
      font-weight: 700;
    }

    .action-btn.primary:hover {
      box-shadow: 0 0 12px var(--cyan-glow);
      filter: brightness(1.1);
    }

    #chat-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      width: 320px;
      padding: 6px 8px;
      font-family: inherit;
    }

    #chat-input::placeholder {
      color: var(--text-muted);
    }

    .emoji-pill {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      padding: 4px 8px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }

    .emoji-pill:hover {
      transform: scale(1.25);
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 229, 255, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 16px; letter-spacing: 0.5px;">CONNECTING TO KNOT MULTIPLAYER...</div>
    <div style="color: var(--text-muted); font-size: 13px;">Establishing low-latency video stream & seat channel</div>
  </div>



  <!-- Viewport Area -->
  <div id="viewport-container">
    <canvas id="desktop-canvas" width="1280" height="800" tabindex="0"></canvas>
  </div>

  <!-- Floating Cursor Chat Input -->
  <form id="chat-drawer" onsubmit="sendChat(event)">
    <span style="font-size: 14px;">💬</span>
    <input id="chat-input" type="text" placeholder="Type a message or speech bubble above your cursor..." autocomplete="off">
    <button type="button" class="emoji-pill" onclick="insertEmoji('🔥')">🔥</button>
    <button type="button" class="emoji-pill" onclick="insertEmoji('🚀')">🚀</button>
    <button type="button" class="emoji-pill" onclick="insertEmoji('✨')">✨</button>
    <button type="button" class="emoji-pill" onclick="insertEmoji('👍')">👍</button>
    <button type="submit" class="action-btn primary" style="padding: 4px 12px;">Send</button>
  </form>

  <script>
    const canvas = document.getElementById('desktop-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const chatInput = document.getElementById('chat-input');
    const pingLabel = document.getElementById('ping-label');
    const fpsLabel = document.getElementById('fps-label');
    const loadingOverlay = document.getElementById('loading-overlay');

    const CANVAS_WIDTH = 1280;
    const CANVAS_HEIGHT = 800;

    let ws = null;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let pingStartTime = 0;

    // Connect WebSocket
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'blob';

      ws.onopen = () => {
        console.log('✅ Connected to Knot WebSocket!');
        loadingOverlay.style.opacity = '0';
        setTimeout(() => loadingOverlay.style.display = 'none', 500);

        // Send Join handshake
        send({
          type: 'join',
          user_name: 'Bob (Web Guest)',
          color_hex: '#00E5FF'
        });

        // Request initial frame
        send({ type: 'frame_ack' });

        // Start ping loop
        setInterval(sendPing, 2000);
      };

      ws.onmessage = async (event) => {
        if (typeof event.data === 'string') {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'pong') {
              const rtt = Math.round(performance.now() - pingStartTime);
              if (pingLabel) pingLabel.innerText = `${rtt} ms`;
            } else if (msg.type === 'desktop_sync') {
              latestDesktopState = msg;
              renderDesktop();

              frameCount++;
              const now = performance.now();
              if (now - lastFpsTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                if (fpsLabel) fpsLabel.innerText = `${fps} FPS`;
                frameCount = 0;
                lastFpsTime = now;
              }
            }
          } catch (e) {}
        } else if (event.data instanceof Blob) {
          try {
            const bitmap = await createImageBitmap(event.data);
            if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
              canvas.width = bitmap.width;
              canvas.height = bitmap.height;
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              resizeCanvas();
            }
            if (latestBitmap) {
              try { latestBitmap.close(); } catch(e) {}
            }
            latestBitmap = bitmap;
            ctx.drawImage(latestBitmap, 0, 0);

            // Render Bob's Cyan cursor locally with 0ms latency
            if (pendingMotion) {
              renderLocalCursorOverlay(pendingMotion.x, pendingMotion.y);
            }

            // Immediately acknowledge frame to server to request newest frame
            send({ type: 'frame_ack' });

            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
              const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
              if (fpsLabel) fpsLabel.innerText = `${fps} FPS`;
              frameCount = 0;
              lastFpsTime = now;
            }
          } catch (err) {
            console.error('Frame decode error:', err);
            send({ type: 'frame_ack' });
          }
        }
      };

      ws.onclose = () => {
        console.warn('❌ Disconnected from Knot host. Reconnecting in 2s...');
        loadingOverlay.style.display = 'flex';
        loadingOverlay.style.opacity = '1';
        setTimeout(connect, 2000);
      };
    }

    let latestDesktopState = null;

    function renderDesktop() {
      if (!latestDesktopState) return;
      const s = latestDesktopState;

      // 1. Draw Modern Workspace Gradient
      const grad = ctx.createLinearGradient(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      grad.addColorStop(0, '#0a0e17');
      grad.addColorStop(0.5, '#0f172a');
      grad.addColorStop(1, '#05070d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Subtle Workspace Dot Grid
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      for (let x = 20; x < CANVAS_WIDTH; x += 40) {
        for (let y = 50; y < CANVAS_HEIGHT; y += 40) {
          ctx.beginPath();
          ctx.arc(x, y, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Render Windows
      if (s.windows && s.windows.length > 0) {
        for (const win of s.windows) {
          const wx = win.x;
          const wy = win.y;
          const ww = win.width;
          const wh = win.height;

          // Glowing Multi-Seat Focus Border
          let glowColor = 'rgba(255, 255, 255, 0.1)';
          let glowSize = 4;
          if (win.focused_by === 'seat-alice') {
            glowColor = '#FF4081';
            glowSize = 12;
          } else if (win.focused_by === 'seat-bob') {
            glowColor = '#00E5FF';
            glowSize = 12;
          }

          ctx.shadowColor = glowColor;
          ctx.shadowBlur = glowSize;

          // Window Base Container
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.roundRect(wx, wy, ww, wh, 10);
          ctx.fill();

          ctx.strokeStyle = glowColor;
          ctx.lineWidth = win.focused_by ? 2 : 1;
          ctx.stroke();
          ctx.shadowBlur = 0; // reset

          // Window Titlebar Header
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.roundRect(wx, wy, ww, 36, [10, 10, 0, 0]);
          ctx.fill();

          // Titlebar Traffic Light Controls
          ctx.fillStyle = '#ff5f56';
          ctx.beginPath();
          ctx.arc(wx + 18, wy + 18, 5.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffbd2e';
          ctx.beginPath();
          ctx.arc(wx + 34, wy + 18, 5.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#27c93f';
          ctx.beginPath();
          ctx.arc(wx + 50, wy + 18, 5.5, 0, Math.PI * 2);
          ctx.fill();

          // Window Title Text
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '600 12px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(win.title || 'Wayland Application', wx + ww / 2, wy + 23);
          ctx.textAlign = 'left';

          // Focused Seat User Tag on Titlebar
          if (win.focused_by) {
            const seatColor = win.focused_by === 'seat-alice' ? '#FF4081' : '#00E5FF';
            const seatLabel = win.focused_by === 'seat-alice' ? 'ALICE' : 'BOB';
            ctx.fillStyle = seatColor;
            ctx.beginPath();
            ctx.roundRect(wx + ww - 80, wy + 8, 70, 20, 10);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillText(seatLabel, wx + ww - 62, wy + 22);
          }

          // Window Body Content Placeholder / Terminal Shell
          ctx.fillStyle = '#090d16';
          ctx.fillRect(wx + 2, wy + 37, ww - 4, wh - 39);

          ctx.fillStyle = '#64748b';
          ctx.font = '12px "Fira Code", monospace';
          ctx.fillText('knot@desktop:~$ interactive session active', wx + 16, wy + 65);
          ctx.fillStyle = '#00E5FF';
          ctx.fillText('❯ Wayland client live and responding to input...', wx + 16, wy + 90);
        }
      } else {
        // Empty Workspace Banner
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.font = '500 15px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✨ No active windows. Click [+ App Launcher] or press Super to launch apps!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
        ctx.textAlign = 'left';
      }

      // 4. App Launcher Modal (if open)
      if (s.launcher_open) {
        // Darkened backdrop
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const mx = 320;
        const my = 100;
        const mw = 640;
        const mh = 510;

        ctx.shadowColor = '#00E5FF44';
        ctx.shadowBlur = 30;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.beginPath();
        ctx.roundRect(mx, my, mw, mh, 16);
        ctx.fill();

        ctx.strokeStyle = '#00E5FF';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Modal Header
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 17px Inter, sans-serif';
        ctx.fillText('🚀 Application Palette', mx + 24, my + 40);

        // Search Bar
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath();
        ctx.roundRect(mx + 20, my + 56, mw - 40, 42, 10);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '14px Inter, sans-serif';
        ctx.fillText(`🔍 ${s.launcher_query || 'Type to search applications...'}|`, mx + 36, my + 82);

        // App Catalog Rows
        if (s.launcher_apps) {
          let ry = my + 115;
          for (let i = 0; i < Math.min(s.launcher_apps.length, 6); i++) {
            const app = s.launcher_apps[i];
            ctx.fillStyle = i === 0 ? 'rgba(0, 229, 255, 0.15)' : 'rgba(255, 255, 255, 0.03)';
            ctx.beginPath();
            ctx.roundRect(mx + 20, ry, mw - 40, 52, 8);
            ctx.fill();
            if (i === 0) {
              ctx.strokeStyle = '#00E5FF';
              ctx.stroke();
            }

            ctx.font = '22px sans-serif';
            ctx.fillText(app.icon || '📦', mx + 36, ry + 34);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Inter, sans-serif';
            ctx.fillText(app.title, mx + 75, ry + 24);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px Inter, sans-serif';
            ctx.fillText(app.description || app.category, mx + 75, ry + 42);

            ry += 60;
          }
        }
      }

      // 5. Render Multiplayer Seats (Alice & Bob)
      if (s.seats) {
        for (const seat of s.seats) {
          const cx = seat.x;
          const cy = seat.y;

          // Draw Cursor Pointer
          ctx.shadowColor = seat.color;
          ctx.shadowBlur = 10;
          ctx.fillStyle = seat.color;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + 16, cy + 12);
          ctx.lineTo(cx + 8, cy + 14);
          ctx.lineTo(cx + 12, cy + 22);
          ctx.lineTo(cx + 8, cy + 24);
          ctx.lineTo(cx + 4, cy + 16);
          ctx.lineTo(cx, cy + 18);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;

          // User Badge
          ctx.fillStyle = seat.color;
          ctx.beginPath();
          ctx.roundRect(cx + 16, cy + 16, 56, 18, 9);
          ctx.fill();

          ctx.fillStyle = '#000000';
          ctx.font = 'bold 10px Inter, sans-serif';
          ctx.fillText(seat.name.toUpperCase(), cx + 22, cy + 29);

          // Cursor Chat Bubble
          if (seat.chat) {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.beginPath();
            ctx.roundRect(cx + 16, cy - 30, Math.min(220, seat.chat.length * 9 + 30), 26, 13);
            ctx.fill();
            ctx.strokeStyle = seat.color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '500 11px Inter, sans-serif';
            ctx.fillText(`💬 ${seat.chat}`, cx + 26, cy - 13);
          }
        }
      }
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    function sendPing() {
      pingStartTime = performance.now();
      send({ type: 'ping' });
    }

    // Auto-scale canvas to fit window maintaining exact aspect ratio
    function resizeCanvas() {
      const container = document.getElementById('viewport-container');
      const maxW = container ? container.clientWidth : window.innerWidth;
      const maxH = container ? container.clientHeight : window.innerHeight;

      const curW = canvas.width || 1280;
      const curH = canvas.height || 800;
      const aspect = curW / curH;
      let w = maxW;
      let h = w / aspect;

      if (h > maxH) {
        h = maxH;
        w = h * aspect;
      }

      canvas.style.width = `${Math.round(w)}px`;
      canvas.style.height = `${Math.round(h)}px`;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Map screen mouse coordinates to dynamic compositor space
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.max(0, Math.min(canvas.width, (e.clientX - rect.left) * scaleX));
      const y = Math.max(0, Math.min(canvas.height, (e.clientY - rect.top) * scaleY));
      return { x, y };
    }

    // High precision Pointer Tracking with rAF throttling & click coordinate sync
    let pendingMotion = null;
    let motionRafId = null;
    let latestBitmap = null;

    function renderLocalCursorOverlay(cx, cy) {
      ctx.shadowColor = '#00E5FF';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#00E5FF';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + 14, cy + 10);
      ctx.lineTo(cx + 7, cy + 12);
      ctx.lineTo(cx + 10, cy + 19);
      ctx.lineTo(cx + 7, cy + 20);
      ctx.lineTo(cx + 4, cy + 13);
      ctx.lineTo(cx, cy + 15);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // User Badge
      ctx.fillStyle = '#00E5FF';
      ctx.beginPath();
      ctx.roundRect(cx + 14, cy + 14, 52, 16, 8);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 9px Inter, sans-serif';
      ctx.fillText('BOB (YOU)', cx + 18, cy + 26);
    }

    canvas.addEventListener('pointermove', (e) => {
      pendingMotion = getCanvasCoords(e);
      if (latestBitmap) {
        ctx.drawImage(latestBitmap, 0, 0);
        renderLocalCursorOverlay(pendingMotion.x, pendingMotion.y);
      }
      if (!motionRafId) {
        motionRafId = requestAnimationFrame(() => {
          motionRafId = null;
          if (pendingMotion) {
            send({
              type: 'pointer_motion',
              x: pendingMotion.x,
              y: pendingMotion.y
            });
          }
        });
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      canvas.focus();
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      const { x, y } = getCanvasCoords(e);
      send({ type: 'pointer_motion', x, y });
      const button = e.button === 0 ? 272 : (e.button === 2 ? 273 : 274);
      send({
        type: 'pointer_button',
        button: button,
        pressed: true
      });
    });

    canvas.addEventListener('pointerup', (e) => {
      try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
      const { x, y } = getCanvasCoords(e);
      send({ type: 'pointer_motion', x, y });
      const button = e.button === 0 ? 272 : (e.button === 2 ? 273 : 274);
      send({
        type: 'pointer_button',
        button: button,
        pressed: false
      });
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Physical Keyboard to Linux XKB Keycode Translation
    const KEY_MAP = {
      'Escape': 9,
      'Digit1': 10, 'Digit2': 11, 'Digit3': 12, 'Digit4': 13, 'Digit5': 14,
      'Digit6': 15, 'Digit7': 16, 'Digit8': 17, 'Digit9': 18, 'Digit0': 19,
      'Minus': 20, 'Equal': 21, 'Backspace': 22, 'Tab': 23,
      'KeyQ': 24, 'KeyW': 25, 'KeyE': 26, 'KeyR': 27, 'KeyT': 28, 'KeyY': 29, 'KeyU': 30, 'KeyI': 31, 'KeyO': 32, 'KeyP': 33,
      'BracketLeft': 34, 'BracketRight': 35, 'Enter': 36, 'ControlLeft': 37,
      'KeyA': 38, 'KeyS': 39, 'KeyD': 40, 'KeyF': 41, 'KeyG': 42, 'KeyH': 43, 'KeyJ': 44, 'KeyK': 45, 'KeyL': 46,
      'Semicolon': 47, 'Quote': 48, 'Backquote': 49, 'ShiftLeft': 50, 'Backslash': 51,
      'KeyZ': 52, 'KeyX': 53, 'KeyC': 54, 'KeyV': 55, 'KeyB': 56, 'KeyN': 57, 'KeyM': 58,
      'Comma': 59, 'Period': 60, 'Slash': 61, 'ShiftRight': 62, 'AltLeft': 64, 'Space': 65,
      'F1': 67, 'F2': 68, 'F3': 69, 'F4': 70, 'F5': 71, 'F6': 72, 'F7': 73, 'F8': 74, 'F9': 75, 'F10': 76,
      'ArrowUp': 111, 'ArrowLeft': 113, 'ArrowRight': 114, 'ArrowDown': 116,
      'MetaLeft': 133, 'MetaRight': 133
    };

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === chatInput) return;
      const keycode = KEY_MAP[e.code];
      if (keycode) {
        e.preventDefault();
        send({
          type: 'key_event',
          keycode: keycode,
          pressed: true
        });
      }
    });

    window.addEventListener('keyup', (e) => {
      if (document.activeElement === chatInput) return;
      const keycode = KEY_MAP[e.code];
      if (keycode) {
        e.preventDefault();
        send({
          type: 'key_event',
          keycode: keycode,
          pressed: false
        });
      }
    });

    // Chat Handler
    function sendChat(e) {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      send({
        type: 'cursor_chat',
        message: text
      });
      chatInput.value = '';
      canvas.focus();
    }

    function insertEmoji(emoji) {
      chatInput.value += emoji;
      chatInput.focus();
    }

    // Fullscreen toggle on canvas double-click
    canvas.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Start
    connect();
  </script>
</body>
</html>
