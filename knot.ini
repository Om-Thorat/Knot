[core]
# Tell Weston to use the Wayland backend (nested)
backend=wayland-backend.so
# This is the key: don't restrict to one seat
idle-time=0

[shell]
# Ensure a theme is set so the cursor actually has a shape
cursor-theme=Adwaita
cursor-size=32

[libinput]
# Force libinput to enable all devices
enable-tap=true
